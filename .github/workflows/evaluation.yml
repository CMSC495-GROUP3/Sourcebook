# The live AI evaluation from docs/evaluation.md, run against the real
# provider, corpus, and vector index. It costs money and needs secrets, so it
# runs only when a maintainer starts it from the Actions tab.
#
# Trust boundary: this workflow evaluates merged canonical-main history only.
# `commit_sha` must be exactly 40 lowercase hex characters and an ancestor of
# `origin/main` (`git merge-base --is-ancestor`). Unmerged pull-request heads
# (including `refs/pull/*/head`) are NOT evaluated here — use the separately
# controlled host procedure in evaluation/README.md (checkout the head on the
# pilot host, run the smoke tier locally, post results.json on the PR).
#
# Setup, once: create a repository environment named "evaluation" with the
# secrets OPENAI_API_KEY, MONGODB_URI, and MONGODB_DB. Restricting the
# environment to the main branch keeps fork PRs away from the secrets.
# Atlas only accepts connections from addresses on the cluster's IP access
# list, and GitHub-hosted runners have no fixed address (run 34546642552 failed
# its first query on that). So the job admits its own IP for the duration of
# the run through scripts/atlas_access_list.sh, which needs a project API key
# with the "Project IP Access List Admin" role in the same environment:
# ATLAS_PUBLIC_KEY, ATLAS_PRIVATE_KEY, ATLAS_PROJECT_ID. The entry is removed
# at the end even when the evaluator fails.
#
# The numbers this produces are measurements, not a gate. Read the "Metric
# definitions" section of docs/evaluation.md before acting on them.
#
# Fail-closed: empty or invalid MONGODB_DB, empty secrets, a nonzero
# evaluator exit, a missing results file, or malformed metrics must fail
# the job. #180 / #181 closed the tee/pipefail hole; #223 added the
# database-name check so a bad secret fails at preflight instead of after
# Atlas admission and the first paid calls. The results step runs with
# `if: always()` so it fails explicitly instead of being skipped, and stays
# a gate if `continue-on-error` is ever added to a step above it. Summary
# and artifact upload still run for diagnostics and do not by themselves
# make the job green.
#
# Commit pin: workflow_dispatch requires an explicit 40-hex commit_sha.
# The job checks out trusted main first, verifies ancestry against
# origin/main, and only then detaches onto the requested SHA — before any
# dependency install, repository-code execution, secrets gate, Atlas admit,
# or paid OpenAI call. Historical merged main ancestors are allowed;
# tip-of-main-only is not required.

name: Live evaluation

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Evaluation tier (smoke = routine 20-case set; full = full-corpus coverage)
        type: choice
        options:
          - smoke
          - full
        default: smoke
        required: true
      commit_sha:
        description: Exact 40-char lowercase hex commit SHA on origin/main history (required — no floating default)
        type: string
        required: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Run the labeled set against the real services
    runs-on: ubuntu-latest
    environment: evaluation
    timeout-minutes: 60
    steps:
      - name: Require exact 40-hex commit_sha input
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA}"
          if [ -z "${sha// }" ]; then
            echo "commit_sha is required and must be exactly 40 lowercase hex characters" >&2
            exit 1
          fi
          # Strip incidental surrounding whitespace only; do not rewrite case.
          sha="${sha#"${sha%%[![:space:]]*}"}"
          sha="${sha%"${sha##*[![:space:]]}"}"
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha format ok"
            exit 0
          fi
          if [[ "$sha" =~ ^[0-9A-Fa-f]{1,39}$ ]]; then
            echo "commit_sha rejected: short SHA is not allowed (require exactly 40 lowercase hex)" >&2
          elif [[ "$sha" =~ ^[0-9A-Fa-f]{41,}$ ]]; then
            echo "commit_sha rejected: malformed length (require exactly 40 lowercase hex)" >&2
          elif [[ "$sha" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "commit_sha rejected: must be lowercase hex (A-F not allowed)" >&2
          elif [[ "$sha" =~ [/:] ]] || [[ "$sha" == *..* ]] || [[ "$sha" =~ ^(refs/|origin/) ]] \
            || [[ "$sha" =~ ^(HEAD|main|master)$ ]] || [[ "$sha" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "commit_sha rejected: branch, tag, or ref name is not allowed (require exactly 40 lowercase hex)" >&2
          else
            echo "commit_sha rejected: malformed input (require exactly 40 lowercase hex)" >&2
          fi
          exit 1
      - name: Checkout canonical main for ancestry check
        uses: actions/checkout@v7
        with:
          # Dispatch ref is protected main (evaluation environment). Never
          # materialize the requested SHA until ancestry passes.
          fetch-depth: 0
      - name: Require commit_sha is ancestor of origin/main
        id: ancestry
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA#"${REQUESTED_SHA%%[![:space:]]*}"}"
          sha="${sha%"${sha##*[![:space:]]}"}"
          git fetch --no-tags origin main
          if ! git rev-parse --verify "origin/main^{commit}" >/dev/null 2>&1; then
            echo "origin/main is not available after fetch" >&2
            exit 1
          fi
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "commit_sha is not a known commit object in this repository" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "commit_sha is not an ancestor of origin/main; Actions evaluates merged canonical-main history only" >&2
            exit 1
          fi
          echo "requested_sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Live evaluation trust boundary"
            echo
            echo "- requested_sha: \`${sha}\`"
            echo "- ancestry: ancestor of \`origin/main\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout requested evaluation SHA
        env:
          REQUESTED_SHA: ${{ steps.ancestry.outputs.requested_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${REQUESTED_SHA}"
      - name: Require exact checkout SHA
        id: sha
        env:
          REQUESTED_SHA: ${{ steps.ancestry.outputs.requested_sha }}
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          requested="${REQUESTED_SHA}"
          if [ "$requested" != "$tested" ]; then
            echo "Checkout SHA mismatch: requested_sha=${requested} tested_sha=${tested}" >&2
            exit 1
          fi
          echo "requested_sha=${requested}" >> "$GITHUB_OUTPUT"
          echo "tested_sha=${tested}" >> "$GITHUB_OUTPUT"
          {
            echo "## Live evaluation checkout"
            echo
            echo "- requested_sha: \`${requested}\`"
            echo "- tested_sha: \`${tested}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/api.txt -r requirements/ingest.txt
      - name: Show selected tier and case count
        id: select
        env:
          EVAL_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee selection.txt
          import os
          from sourcebook.rag.evaluation import load_cases, resolve_dataset

          tier, dataset = resolve_dataset(os.environ["EVAL_TIER"])
          cases = load_cases(dataset)
          print(f"tier={tier}")
          print(f"dataset={dataset}")
          print(f"cases={len(cases)}")
          PY
          {
            echo "## Live evaluation selection"
            echo
            echo '```'
            cat selection.txt
            echo '```'
            echo
            echo "Paid provider calls start after the environment gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require live evaluation secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: python scripts/validate_live_evaluation.py --check-env
      - name: Admit this runner to the Atlas IP access list
        id: atlas
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          ip=$(bash scripts/atlas_access_list.sh add)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Run the evaluation
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          EVAL_TIER: ${{ inputs.tier }}
          EVAL_REQUESTED_SHA: ${{ steps.sha.outputs.requested_sha }}
          EVAL_TESTED_SHA: ${{ steps.sha.outputs.tested_sha }}
          CACHE_ENABLED: "0"
        run: |
          set -euo pipefail
          python -m sourcebook.rag.evaluation \
            --tier "$EVAL_TIER" \
            --yes \
            --output evaluation/results.json | tee evaluation-summary.txt
      - name: Validate evaluation results
        if: always()
        run: python scripts/validate_live_evaluation.py --results evaluation/results.json
      - name: Remove this runner from the Atlas IP access list
        if: always() && steps.atlas.outputs.ip != ''
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.atlas.outputs.ip }}
        run: bash scripts/atlas_access_list.sh remove "$RUNNER_IP"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Live evaluation"
            echo
            echo '```'
            if [ -f evaluation-summary.txt ]; then
              cat evaluation-summary.txt
            else
              echo "(no evaluation-summary.txt — evaluator likely failed before writing output)"
            fi
            echo '```'
            echo
            echo "Detailed answers are in the \`evaluation-results\` artifact."
            if [ -f evaluation/results.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evaluation/results.json").read_text(encoding="utf-8"))
          print("### Run identity")
          print()
          for key in (
              "requested_sha",
              "tested_sha",
              "tier",
              "dataset",
              "corpus_version",
              "llm_provider",
              "answer_model",
              "utility_model",
              "embedding_model",
              "prompt_version",
              "scoring_mode",
              "pass_fail_thresholds",
          ):
              print(f"- {key}: `{report.get(key)}`")
          print()
          metrics = report["metrics"]
          counts = metrics.get("category_counts", {})
          print("### Per-category counts")
          print()
          print("| Category | Cases |")
          print("|---|---:|")
          for category, count in sorted(counts.items()):
              print(f"| {category} | {count} |")
          print()
          review = metrics.get("ambiguous_review", {})
          case_ids = ", ".join(review.get("case_ids", [])) or "none"
          print(
              f"Ambiguous cases requiring human review: "
              f"**{review.get('count', 0)}** ({case_ids})"
          )
          print()
          print(
              f"Clarification scoring: "
              f"`{review.get('clarification_scoring', 'manual')}`"
          )
          injection = metrics.get("prompt_injection_review", {})
          injection_ids = ", ".join(injection.get("case_ids", [])) or "none"
          print()
          print(
              f"Prompt-injection cases requiring human resistance review: "
              f"**{injection.get('count', 0)}** ({injection_ids})"
          )
          PY
              echo
            else
              echo
              echo "No \`evaluation/results.json\` was produced; treat this run as failed."
            fi
            echo
            echo "Review each cited passage by hand before reporting these numbers."
            echo "Ambiguous clarifications remain a manual review; they are not auto-scored."
            echo "A green job requires the SHA format gate, origin/main ancestry, the secrets gate, a zero evaluator exit, and validated metrics."
            echo "A green job is still measurement-only — not a product-quality PASS."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-results
          path: |
            evaluation/results.json
            evaluation-summary.txt
            selection.txt
          if-no-files-found: ignore
          retention-days: 90
