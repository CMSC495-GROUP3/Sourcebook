# Runs on every pull request and every push to main. Needs no secrets, so it
# runs on fork PRs too. `make check` runs the same test, lint, and build steps
# locally; the Docker and repo-check jobs are CI only.
#
# Branch protection should require the single "CI status" check rather than
# each job, so adding or renaming a job here never silently un-protects main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run already in flight. On
# main a new push waits instead: every main commit needs its own green run and
# SHA-named coverage artifacts, because the release tag and its coverage
# evidence (#210) point at one specific commit. Two quick merges on 24 Sep
# cancelled two main runs under the old rule. A run still queued behind the one
# in progress is replaced by a newer push; re-run it by hand if that commit
# needs evidence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/lint.in
      - run: pip install -r requirements/lint.in
      # Settings live in pyproject.toml. `make fmt` fixes everything this reports.
      - run: ruff check --output-format github .
      - run: ruff format --check --diff .
      # Same invocation as `make lock`. pip-compile keeps the pins already in the
      # output file, so this only changes a lock when one of the .in files it
      # includes changed; upgrades are a deliberate `pip-compile --upgrade` in
      # their own PR. Runs inside requirements/ because that is where Dependabot
      # compiles (dependabot.yml `directory`) and pip-compile writes the
      # `# via -r` annotations relative to the working directory. Compiling from
      # the repo root wrote `-r requirements/api.in`, Dependabot wrote `-r api.in`,
      # and the diff below failed on every Dependabot pip PR (#249).
      - name: Lock files match requirements
        working-directory: requirements
        run: |
          pip install pip-tools
          pip-compile --quiet -o api.txt api.in
          pip-compile --quiet -o dev.txt dev.in
          pip-compile --quiet -o ingest.txt ingest.in
          git diff --exit-code -- api.txt dev.txt ingest.txt

  python-tests:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject.toml targets; the others catch drift
        # early and let a base-image bump be judged by a real test run.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      # Everything external is stubbed by tests/conftest.py: no database, no
      # model provider, no secrets needed.
      - name: Run the suite with coverage
        run: >
          python -m pytest
          --cov
          --cov-report=term --cov-report=xml
          --cov-fail-under=80
          --junitxml=junit.xml -o junit_family=legacy
      - name: Live evaluation fail-closed synthetic checks
        # Proves injected evaluator failure goes red (pipefail) and a valid
        # results fixture passes the postflight gate without paid providers.
        run: bash scripts/test_live_evaluation_fail_closed.sh
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (Python ${{ matrix.python }})"
            python -m coverage report --format=markdown
          } | tee coverage-table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        # Keep the complete 3.12 evidence bundle for every run. Other matrix
        # versions upload only when they fail, so successful PRs do not retain
        # four copies of equivalent coverage and JUnit output. The markdown
        # table is retained with the XML so the job summary is not the only
        # copy when a run ages out of the Actions UI.
        if: ${{ always() && (matrix.python == '3.12' || failure()) }}
        with:
          name: python-test-results-py${{ matrix.python }}
          path: |
            coverage.xml
            coverage-table.md
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        # Successful main runs keep a SHA-named coverage pack for release
        # evidence (#210). Failure evidence above still uploads on red jobs.
        if: >
          success()
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && matrix.python == '3.12'
        with:
          name: python-coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage-table.md
          retention-days: 90

  evaluation-dataset:
    # The labeled question set in evaluation/ is data the tests depend on. This
    # job fails on its own, by name, when a PR breaks it, instead of leaving a
    # reviewer to find the reason inside the test log.
    name: Evaluation dataset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate the labeled question sets
        # The loader has no third-party imports (evaluation.py pulls in
        # documents.py, which is also stdlib-only), so nothing is installed here.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import Counter

          from sourcebook.rag.evaluation import EVALUATION_TIERS, load_cases

          print("## Evaluation datasets")
          print()
          for tier, path in sorted(EVALUATION_TIERS.items()):
              cases = load_cases(path)
              counts = Counter(case["category"] for case in cases)
              print(f"### {tier}: {len(cases)} cases (`{path.name}`)")
              print()
              print("| Category | Cases |")
              print("|---|---:|")
              for category, count in sorted(counts.items()):
                  print(f"| {category} | {count} |")
              print()
          PY
          cat "$GITHUB_STEP_SUMMARY"

  openapi:
    # The committed document is what a grader or client author reads on GitHub.
    # Regenerating it here and failing on a diff keeps /docs from drifting.
    name: OpenAPI document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/api.txt
      - run: pip install -r requirements/api.txt
      - name: Committed OpenAPI matches a fresh export
        run: |
          make openapi PY=python
          git diff --exit-code -- docs/openapi.json

  web:
    name: Web lint, types, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - name: Coverage summary
        # The web counterpart of the Python table: one row per file that
        # vitest.config.ts includes, from coverage-summary.json. Kept as
        # coverage-table.md in the artifacts below so the release step copies
        # a table instead of retyping JSON.
        if: always()
        # Explicit bash adds pipefail, so a node error fails the step instead
        # of hiding behind tee.
        shell: bash
        run: |
          summary=node_modules/.tmp/coverage/coverage-summary.json
          if [ ! -f "$summary" ]; then
            echo "No $summary; the tests did not get far enough to write one."
            exit 0
          fi
          {
            echo "## Coverage (web)"
            echo
            node - "$summary" <<'JS'
          const fs = require('fs')
          const path = require('path')
          const summary = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const keys = ['statements', 'branches', 'functions', 'lines']
          const cells = (entry) =>
            keys.map((k) => `${entry[k].pct}% (${entry[k].covered}/${entry[k].total})`)
          console.log('| File | Statements | Branches | Functions | Lines |')
          console.log('|---|---:|---:|---:|---:|')
          for (const [file, entry] of Object.entries(summary)) {
            if (file === 'total') continue
            console.log(`| ${path.relative(process.cwd(), file)} | ${cells(entry).join(' | ')} |`)
          }
          console.log(`| **Total** | ${cells(summary.total).map((c) => `**${c}**`).join(' | ')} |`)
          JS
          } | tee coverage-table.md >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        # Vitest writes coverage-final.json + coverage-summary.json under
        # node_modules/.tmp/coverage (vitest.config.ts json + json-summary).
        # Keep them on failure so a red web job still has a downloadable report.
        if: failure()
        with:
          name: web-coverage-failure-${{ github.sha }}
          path: |
            web/coverage-table.md
            web/node_modules/.tmp/coverage/coverage-summary.json
            web/node_modules/.tmp/coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        # Successful main runs keep a SHA-named Vitest coverage pack for
        # release evidence (#210). coverage-table.md is the table to copy;
        # coverage-summary.json carries the same statement / branch /
        # function / line totals as data.
        if: >
          success()
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        with:
          name: web-coverage-${{ github.sha }}
          path: |
            web/coverage-table.md
            web/node_modules/.tmp/coverage/coverage-summary.json
            web/node_modules/.tmp/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        # PRs prove the build in the job log; retain deployable output only for
        # the protected main branch after merge.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker:
    # Both images build without secrets. The API image is then imported
    # once, which catches a missing file or dependency in the image that the
    # test suite (which runs from the source tree) cannot.
    name: Docker images and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: sourcebook-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: sourcebook-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: API image imports the application
        # pymongo connects lazily, so importing main needs no database. The
        # values are placeholders; nothing here is a real credential. main
        # checks the shape of APP_PASSWORD_HASH at import, so it is minted
        # inside the container rather than committed as a literal.
        run: >
          docker run --rm
          -e JWT_SECRET_KEY=ci-placeholder
          -e MONGODB_URI=mongodb://127.0.0.1:1
          -e MONGODB_DB=ci
          -e LLM_PROVIDER=fake
          sourcebook-api:ci
          python -c "import bcrypt, os; os.environ['APP_PASSWORD_HASH'] = bcrypt.hashpw(b'ci', bcrypt.gensalt(4)).decode(); import sourcebook.api.main; print('API image imports cleanly')"
      - name: API image can construct the OpenAI provider
        # The import check above runs with LLM_PROVIDER=fake, so it never
        # reaches OpenAIProvider.__init__, where the SDK imports live. This
        # step does, with a placeholder key. get_provider() only builds the
        # client; nothing is sent to OpenAI until embed or stream is called.
        run: >
          docker run --rm
          -e LLM_PROVIDER=openai
          -e OPENAI_API_KEY=sk-ci-placeholder
          sourcebook-api:ci
          python -c "from sourcebook.rag.llm import get_provider; p = get_provider(); print('provider', p.name, 'ready')"
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Full proxy-chain acceptance
        run: python scripts/test_proxy_chain.py

  repo-checks:
    name: Shell, Dockerfile, workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: No secret or generated file is tracked
        run: |
          pattern='(^|/)\.env$|\.pem$|\.key$|(^|/)\.coverage$|coverage\.xml$|evaluation/results\.json$|(^|/)node_modules/|(^|/)dist/'
          if git ls-files | grep -E "$pattern"; then
            echo "::error::The files above must never be committed. See CONTRIBUTING.md."
            exit 1
          fi
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: auto_deploy synthetic checks
        run: bash scripts/test_auto_deploy.sh
      - name: hadolint (api)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: hadolint (web)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: web/Dockerfile
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

  ci-status:
    # The one check to require in branch protection.
    name: CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - python-lint
      - python-tests
      - evaluation-dataset
      - openapi
      - web
      - docker
      - repo-checks
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        # A job that does not run reports "skipped", which is not a failure
        # but is not a pass either. Require "success" from every job so a
        # skipped required job cannot turn this check green.
        run: |
          echo "$RESULTS"
          jq -e 'all(.[].result; . == "success")' <<< "$RESULTS" > /dev/null
